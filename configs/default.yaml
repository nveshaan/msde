# The original MSDE behaviour: exact Euclidean k-NN, sparse-graph density
# weights, density-weighted barycenter, early stopping.
# Check it:  uv run python -m msde.config configs/default.yaml
vars:
  k: 30

device: auto            # auto | cpu | cuda | mps
label_mode: same_label  # same_label | zero_label
log_file: null

neighbors:
  name: EuclideanKNN    # EuclideanKNN | CosineKNN | WhitenedKNN | JointKNN
  k: ${vars.k}
  exclude_self: false

weights:
  name: SparseEmpirical # SparseEmpirical | KDEWeights | GravityWeights | UniformWeights
  nbd_sample_count_threshold: 30
  n_neighbors: 15
  n_epochs: 200
  max_iters_weight_count: 4
  satisfiability_proportion: 0.3
  use_chunking: false
  chunk_size: 4096
  eps: null

step:
  name: PlainBarycenter # PlainBarycenter | GravityBarycenter
  learning_rate: 0.3
  alpha: 0.5
  clipping: false
  clip_mode: 0          # 0 off | 1 saturating | 2 hard cap
  use_sparse_shift: true
  low_precision_barycenter: false

loop:
  name: EarlyStopLoop
  max_iters_shift: 5
  shift_threshold: 0.0001
  recompute_neighbors: 0
  keep_trajectory: false
