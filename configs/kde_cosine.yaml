# Cheaper density (Gaussian KDE) with scale-free cosine neighbours.
vars:
  k: 30

device: auto

neighbors:
  name: CosineKNN
  k: ${vars.k}

weights:
  name: KDEWeights
  bandwidth: scott      # scott | silverman | a positive number

step:
  name: PlainBarycenter
  learning_rate: 0.3

loop:
  name: EarlyStopLoop
  max_iters_shift: 5
