# Gravity ablation 3_approach2. The three ablation configs differ only in 'neighbors' and 'weights';
# everything else is shared through vars. Pass stability scores to forward(..., stability=s).
vars:
  k: 20
  h: auto               # kernel bandwidth: a positive number or auto
  eta: 0.05
  alpha: 1.0
  beta: 1.0
  iterations: 1         # start with one iteration, then increase

device: auto
label_mode: same_label

neighbors:
  name: JointKNN        # joint distance / density / stability selection
  k: ${vars.k}
  h: ${vars.h}
  metric: euclidean     # euclidean | cosine

weights:
  name: GravityWeights  # q = rho^alpha * s^beta
  alpha: ${vars.alpha}
  beta: ${vars.beta}
  density_normalization: max   # none | max | minmax | rank
  density_floor: 1.0e-6
  stability_floor: 0.0
  density:
    name: KDEWeights
    bandwidth: scott

step:
  name: GravityBarycenter
  eta: ${vars.eta}
  h: ${vars.h}
  metric: euclidean
  eps: 1.0e-8

loop:
  name: EarlyStopLoop
  max_iters_shift: ${vars.iterations}
  recompute_neighbors: 0
